name: Publish localizations

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Shorebird release version to patch"
        required: true
        default: "latest"
      track:
        description: "Shorebird track"
        required: true
        default: "staging"

permissions:
  contents: read

concurrency:
  group: publish-localizations-${{ github.ref }}
  cancel-in-progress: false

env:
  ARB_DIR: lib/src/l10n/localization
  BASE_LOCALE: ru
  GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
  LOCALIZATION_SHEET_ID: ${{ secrets.LOCALIZATION_SHEET_ID }}
  SHOREBIRD_TOKEN: ${{ secrets.SHOREBIRD_TOKEN }}

jobs:
  validate:
    name: Generate and validate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Preflight
        run: |
          test -n "$GOOGLE_SERVICE_ACCOUNT_JSON" || { echo "::error::Missing GOOGLE_SERVICE_ACCOUNT_JSON secret"; exit 1; }
          test -n "$LOCALIZATION_SHEET_ID" || { echo "::error::Missing LOCALIZATION_SHEET_ID secret"; exit 1; }

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Prepare Google credentials
        run: |
          credentials_path="$RUNNER_TEMP/google-service-account.json"
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > "$credentials_path"
          echo "GOOGLE_CREDENTIALS_PATH=$credentials_path" >> "$GITHUB_ENV"

      - name: Generate localizations from Google Sheet
        run: |
          dart pub global activate sheety_localization
          dart pub global run sheety_localization:generate \
            --credentials="$GOOGLE_CREDENTIALS_PATH" \
            --sheet="$LOCALIZATION_SHEET_ID" \
            --lib=lib \
            --arb=src/l10n \
            --gen=src/generated \
            --prefix=app \
            --no-last-modified \
            --format

      - name: Validate ARB consistency
        run: dart run lib/tool/validate_arb.dart "$ARB_DIR" "$BASE_LOCALE"

      - name: Validate plural forms
        run: dart run lib/tool/validate_plurals.dart "$ARB_DIR"

      - name: Format check
        run: dart format --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Print localization diff
        run: |
          git diff --stat -- lib/localization.dart lib/src/l10n/localization lib/src/generated
          git diff -- lib/localization.dart lib/src/l10n/localization lib/src/generated > localization.diff

      - name: Upload generated localizations
        uses: actions/upload-artifact@v4
        with:
          name: generated-localizations
          path: |
            lib/localization.dart
            lib/src/l10n/localization
            lib/src/generated
            localization.diff
          retention-days: 7

  patch_android:
    name: Shorebird Android patch
    needs: validate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: generated-localizations
          path: .

      - name: Preflight
        run: |
          test -n "$SHOREBIRD_TOKEN" || { echo "::error::Missing SHOREBIRD_TOKEN secret"; exit 1; }
          test -f shorebird.yaml || { echo "::error::shorebird.yaml is missing. Run shorebird init and commit shorebird.yaml before publishing patches."; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: shorebirdtech/setup-shorebird@v1
        with:
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Show approved diff
        run: cat localization.diff

      - name: Publish Shorebird patch
        uses: shorebirdtech/shorebird-patch@v1
        with:
          platform: android
          release-version: ${{ inputs.release_version }}
          args: "--track ${{ inputs.track }}"
